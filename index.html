<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/style.css">
  <title>Calculator</title>
</head>
<body>
  <div class="flex">
    <div class="r2d2">
      <input class="pantalla" type="text" id="pantalla" disabled/>
      <div class="flex-2">
        <div class="columnaLateral">
          <div class="columna">
            <input class="tecla" type="button" value="1" onclick="addToScreen('1')"/>
            <input class="tecla" type="button" value="4" onclick="addToScreen('4')"/>
            <input class="tecla" type="button" value="7" onclick="addToScreen('7')"/>
            <input class="tecla" type="button" value="=" onclick="calculate()"/>
          </div>
          <div class="columna">
            <input class="tecla" type="button" value="2" onclick="addToScreen('2')"/>
            <input class="tecla" type="button" value="5" onclick="addToScreen('5')"/>
            <input class="tecla" type="button" value="8" onclick="addToScreen('8')"/>
            <input class="tecla" type="button" value="0" onclick="addToScreen('0')"/>
          </div>
        </div>
        <div class="columnaLateral">
          <div class="columna">
            <input class="tecla" type="button" value="3" onclick="addToScreen('3')"/>
            <input class="tecla" type="button" value="6" onclick="addToScreen('6')"/>
            <input class="tecla" type="button" value="9" onclick="addToScreen('9')"/>
            <input class="tecla" type="button" value="C" onclick="clearScreen('c')"/>
          </div>
          <div class="columna">
            <input class="tecla" type="button" value="+" onclick="addToScreen('+')"/>
            <input class="tecla" type="button" value="-" onclick="addToScreen('-')"/>
            <input class="tecla" type="button" value="*" onclick="addToScreen('*')"/>
            <input class="tecla" type="button" value="/" onclick="addToScreen('/')"/>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript"  src="./js/calculator.js" charset="UTF-8"></script>
</body>
</html>
